[nas]
mount_path = "/nas/inkwell"

[schedule]
cron = "0 3 * * *"
time_window_start = ""
time_window_end = ""
stale_threshold_days = 0

[download]
retry_attempts = 3
retry_backoff = [5, 15, 45]
timeout = 1200  # 20 min — cold x.com UserMedia walks exceed 10 min (enum is API-paced)
inter_artist_cooldown = [30, 60]

[cookies]
expiry_warning_days = 30

[auth]
password_hash = ""

[retention]
log_days = 90

[rate_limit]
multiplier_step = 1.5
max_multiplier = 8.0
pause_threshold = 6.0
decay_rate = 0.5
pause_seconds = 900  # max seconds a site stays "paused" since its last hit (~x.com window)

[zip]
enabled = true
on_job_complete = true
compression_level = 6

[sites.xcom]
cooldown = [60, 120]

[sites.pixiv]
cooldown = [5, 15]

[sites.deviantart]
cooldown = [5, 15]

[integrity]
enabled = true             # Scheduled integrity check
check_cron = "0 4 * * 0"   # Weekly Sunday 04:00
auto_repair = true         # Attempt re-download of missing files after check
max_posts_per_run = 200    # Cap per scheduled repair run (manual repair is uncapped)
